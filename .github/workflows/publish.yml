name: Release and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching package.json (for example, 1.0.1)
        required: true
        type: string
      verify_only:
        description: Only verify an already-submitted version; never publish again
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Validate release version
        env:
          RELEASE_REF: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_REF.replace(/^v/, '');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Only stable versions such as 1.0.1 or v1.0.1 can be published.');
          }
          const metadata = JSON.parse(readFileSync('package.json', 'utf8'));
          if (metadata.version !== version) {
            throw new Error(`Release ${version} does not match package.json ${metadata.version}. Commit the version bump first.`);
          }
          console.log(`Validated ${metadata.name}@${version}`);
          NODE

      - name: Check publishing secret
        if: inputs.verify_only != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add the NPM_AUTH_TOKEN repository Actions secret with npm publish permission."
            exit 1
          fi

      - name: Check version is unpublished
        if: inputs.verify_only != true
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(
            `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`,
            { signal: AbortSignal.timeout(30000) },
          );
          if (response.status === 200) {
            throw new Error(`${name}@${version} is already published. Choose a new version.`);
          }
          if (response.status !== 404) {
            throw new Error(`Cannot verify npm version availability: HTTP ${response.status}.`);
          }
          console.log(`${name}@${version} is available to publish.`);
          NODE

      - name: Install dependencies
        if: inputs.verify_only != true
        run: npm ci

      - name: Validate release
        if: inputs.verify_only != true
        run: npm run format:check && npm test && npm run check && npm run build

      - name: Audit dependencies
        if: inputs.verify_only != true
        run: npm audit --audit-level=high

      - name: Test installed npm package
        if: inputs.verify_only != true
        run: npm run test:package

      - name: Verify npm authentication
        if: inputs.verify_only != true
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Publish to npm
        if: inputs.verify_only != true
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Verify published version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(
              `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`,
              { signal: AbortSignal.timeout(30000) },
            );
            if (response.ok) {
              const published = await response.json();
              if (published.version !== version) throw new Error('npm returned an unexpected version.');
              console.log(`Verified https://www.npmjs.com/package/${name}/v/${version}`);
              process.exit(0);
            }
            if (response.status !== 404) throw new Error(`npm verification failed: HTTP ${response.status}.`);
            console.log(`Waiting for npm processing (${attempt}/60).`);
            if (attempt < 60) await setTimeout(10000);
          }
          throw new Error('Published version is not visible yet. Inspect npm before retrying the release.');
          NODE
